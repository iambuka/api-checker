services:
  - type: worker
    name: bet25-api-guard
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node worker.mjs
    # No disk: baseline and session live on the instance's temporary filesystem and are rebuilt
    # after each restart or deploy.
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: BET25_LOGIN
        sync: false
      - key: BET25_PASSWORD
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
